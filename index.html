<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skate Rush</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#111;font-family:Arial,sans-serif;overflow:hidden
}
canvas{
  display:block;width:100vw;height:100vh;
  background:linear-gradient(#75c9ff 0 58%,#d8d8d8 58% 100%)
}
#info{
  position:fixed;top:10px;left:10px;right:10px;
  color:white;font-weight:bold;font-size:18px;
  text-shadow:2px 2px #000;z-index:5
}
#boostBox{
  position:fixed;top:70px;left:10px;
  width:150px;height:16px;background:#222;
  border:2px solid white;border-radius:10px;
  overflow:hidden;z-index:5
}
#boostFill{
  height:100%;width:0%;
  background:#00eaff
}
#skinBtn,#nightBtn{
  position:fixed;top:105px;z-index:5;
  font-size:14px;padding:8px 12px;
  border:0;border-radius:10px
}
#skinBtn{left:10px}
#nightBtn{left:115px}
#jumpBtn,#boostBtn{
  position:fixed;bottom:20px;z-index:5;
  border:0;border-radius:14px;
  font-weight:bold
}
#jumpBtn{
  right:20px;font-size:20px;padding:14px 20px
}
#boostBtn{
  right:155px;font-size:18px;padding:14px 15px
}
#start,#gameover{
  position:fixed;inset:0;display:grid;
  place-items:center;background:#0008;
  color:white;z-index:10
}
#gameover{display:none}
#panel{
  background:#111d;padding:28px;
  border:2px solid white;border-radius:18px;
  text-align:center;max-width:90%
}
button{
  font-size:22px;padding:12px 25px;
  border:0;border-radius:12px;cursor:pointer
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="info">
⭐ <span id="score">0</span>
&nbsp; 🏆 <span id="best">0</span>
&nbsp; ❤️ <span id="lives">3</span>
&nbsp; 🪙 <span id="coinCount">0</span>
&nbsp; 💎 <span id="diamondCount">0</span>
</div>

<div id="boostBox">
  <div id="boostFill"></div>
</div>

<button id="skinBtn" onclick="changeSkin()">👕 SKIN</button>
<button id="nightBtn" onclick="toggleNight()">🌙 NUIT</button>

<button id="boostBtn" onclick="useBoost()">⚡ BOOST</button>
<button id="jumpBtn" onclick="jump()">⬆️ SAUTER</button>

<div id="start">
  <div id="panel">
    <h1>🛹 SKATE RUSH</h1>
    <p>← → bouger • Espace sauter</p>
    <p>⚡ Ramasse les pièces pour charger le boost !</p>
    <button onclick="startGame()">JOUER</button>
  </div>
</div>

<div id="gameover">
  <div id="panel">
    <h1>💥 GAME OVER</h1>
    <p>⭐ Score : <span id="finalScore">0</span></p>
    <p>🏆 Meilleur : <span id="finalBest">0</span></p>
    <p>🪙 Pièces : <span id="finalCoins">0</span></p>
    <p>💎 Diamants : <span id="finalDiamonds">0</span></p>
    <button onclick="startGame()">🔄 REJOUER</button>
  </div>
</div>

<script>
const c=document.getElementById('game');
const x=c.getContext('2d');

let W,H,player,obs,coins,ramps,diamonds,cars;
let score,lives,coinCount,diamondCount;
let running=false;
let speed=7;
let keys={};

let spawnTimer=0;
let coinTimer=0;
let rampTimer=0;
let diamondTimer=0;
let carTimer=0;

let boost=0;
let boosting=false;

let night=false;
let skin=0;
let trickText="";
let trickTimer=0;

let bestScore=Number(localStorage.getItem("skateRushBest")||0);

const skins=[
  {body:"#ff4081",helmet:"#222"},
  {body:"#2196f3",helmet:"#ffeb3b"},
  {body:"#4caf50",helmet:"#111"},
  {body:"#ff9800",helmet:"#9c27b0"},
  {body:"#e91e63",helmet:"#00bcd4"}
];

function resize(){
  W=c.width=innerWidth;
  H=c.height=innerHeight;
}
addEventListener('resize',resize);
resize();

addEventListener('keydown',e=>{
  keys[e.key]=true;

  if(e.code==='Space'){
    e.preventDefault();
    jump();
  }

  if(e.code==='ShiftLeft' || e.code==='ShiftRight'){
    useBoost();
  }
});

addEventListener('keyup',e=>{
  keys[e.key]=false;
});

function jump(){

  if(running && player && player.on){

    player.vy=-15;
    player.on=false;

    if(Math.random()<0.5){
      trickText="🛹 OLLIE !";
      trickTimer=45;
    }
  }
}

function useBoost(){

  if(!running || boost<100 || boosting)return;

  boost=0;
  boosting=true;
  speed+=9;

  trickText="⚡ BOOST !";
  trickTimer=60;

  setTimeout(()=>{
    boosting=false;
  },2200);
}

function changeSkin(){

  skin++;

  if(skin>=skins.length)
    skin=0;
}

function toggleNight(){
  night=!night;
}

function startGame(){

  document.getElementById('start').style.display='none';
  document.getElementById('gameover').style.display='none';

  score=0;
  lives=3;
  coinCount=0;
  diamondCount=0;

  speed=7;
  boost=0;
  boosting=false;

  obs=[];
  coins=[];
  ramps=[];
  diamonds=[];
  cars=[];

  spawnTimer=0;
  coinTimer=0;
  rampTimer=0;
  diamondTimer=0;
  carTimer=0;

  player={
    x:W*.25,
    y:H*.62-30,
    w:58,
    h:30,
    vy:0,
    on:true,
    rotation:0
  };

  running=true;
  updateInfo();
}

function hit(a,b){

  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

function updateInfo(){

  document.getElementById('score').textContent=Math.floor(score);
  document.getElementById('best').textContent=bestScore;
  document.getElementById('lives').textContent=lives;
  document.getElementById('coinCount').textContent=coinCount;
  document.getElementById('diamondCount').textContent=diamondCount;

  document.getElementById('boostFill').style.width=boost+"%";
}

/* OBSTACLES */

function spawnObstacle(){

  const types=[
    {w:45,h:45,color:'#e53935'},
    {w:65,h:30,color:'#ff8f00'},
    {w:35,h:55,color:'#8e44ad'}
  ];

  const t=types[Math.floor(Math.random()*types.length)];

  obs.push({
    x:W+50,
    y:H*.62-t.h,
    w:t.w,
    h:t.h,
    color:t.color
  });
}

/* PIÈCES */

function spawnCoin(){

  coins.push({
    x:W+40,
    y:H*.35+Math.random()*H*.25,
    w:25,
    h:25
  });
}

/* DIAMANTS */

function spawnDiamond(){

  diamonds.push({
    x:W+50,
    y:H*.30+Math.random()*H*.28,
    w:30,
    h:30
  });
}

/* RAMPES */

function spawnRamp(){

  ramps.push({
    x:W+60,
    y:H*.62-35,
    w:80,
    h:35
  });
}

/* VOITURES */

function spawnCar(){

  cars.push({
    x:W+100,
    y:H*.62-42,
    w:90,
    h:42,
    color:Math.random()<.5 ? "#1976d2" : "#d32f2f"
  });
}

/* JOUEUR */

function drawPlayer(){

  x.save();

  x.translate(
    player.x+player.w/2,
    player.y+player.h/2
  );

  x.rotate(player.rotation);

  const s=skins[skin];

  // tête
  x.fillStyle='#f2bd91';
  x.beginPath();
  x.arc(0,-27,12,0,Math.PI*2);
  x.fill();

  // casque
  x.fillStyle=s.helmet;
  x.beginPath();
  x.arc(0,-31,13,Math.PI,Math.PI*2);
  x.fill();

  // corps
  x.fillStyle=s.body;
  x.fillRect(-14,-15,28,22);

  // bras
  x.strokeStyle='#f2bd91';
  x.lineWidth=6;

  x.beginPath();
  x.moveTo(-12,-10);
  x.lineTo(-27,5);

  x.moveTo(12,-10);
  x.lineTo(27,5);

  x.stroke();

  // jambes
  x.strokeStyle='#222';
  x.lineWidth=6;

  x.beginPath();
  x.moveTo(-8,7);
  x.lineTo(-18,18);

  x.moveTo(8,7);
  x.lineTo(18,18);

  x.stroke();

  // skate
  x.strokeStyle='#111';
  x.lineWidth=5;

  x.beginPath();
  x.moveTo(-34,21);
  x.lineTo(34,21);
  x.stroke();

  // roues
  x.fillStyle='#111';

  x.beginPath();
  x.arc(-23,25,5,0,Math.PI*2);
  x.arc(23,25,5,0,Math.PI*2);
  x.fill();

  x.restore();
}

/* DÉCOR */

function drawBackground(){

  let skyTop=night ? "#07152e" : "#75c9ff";
  let skyBottom=night ? "#24365c" : "#dff7ff";

  const sky=x.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,skyTop);
  sky.addColorStop(1,skyBottom);

  x.fillStyle=sky;
  x.fillRect(0,0,W,H);

  // soleil ou lune
  x.fillStyle=night ? "#fff59d" : "#ffd93d";

  x.beginPath();
  x.arc(W-90,90,45,0,Math.PI*2);
  x.fill();

  // étoiles
  if(night){

    x.fillStyle="#fff";

    for(let i=0;i<45;i++){

      const sx=(i*97)%W;
      const sy=(i*43)%150;

      x.fillRect(sx,sy,2,2);
    }
  }

  // immeubles
  for(let i=0;i<12;i++){

    const bx=i*110-(Math.floor(score)%110);
    const bh=100+(i%4)*35;

    x.fillStyle=night ? "#26334a" : "#777";

    x.fillRect(
      bx,
      H*.58-bh,
      80,
      bh
    );

    x.fillStyle=night ? "#ffe082" : "#ffe66d";

    for(let wy=0;wy<3;wy++){
      for(let wx=0;wx<2;wx++){

        x.fillRect(
          bx+12+wx*32,
          H*.58-bh+15+wy*35,
          13,
          18
        );
      }
    }
  }

  // sol
  x.fillStyle=night ? "#777" : "#bdbdbd";
  x.fillRect(0,H*.58,W,H*.42);

  // route
  x.fillStyle=night ? "#20252d" : "#3d3d3d";
  x.fillRect(0,H*.62,W,H*.38);

  // lignes
  x.strokeStyle='#fff';
  x.lineWidth=5;
  x.setLineDash([35,30]);

  x.beginPath();
  x.moveTo(0,H*.78);
  x.lineTo(W,H*.78);
  x.stroke();

  x.setLineDash([]);
}

/* OBJETS */

function drawObstacle(o){

  x.fillStyle=o.color;
  x.fillRect(o.x,o.y,o.w,o.h);

  x.fillStyle='#fff';
  x.fillRect(o.x+7,o.y+7,o.w-14,6);
}

function drawCoin(co){

  x.fillStyle='#ffd700';

  x.beginPath();
  x.arc(
    co.x+co.w/2,
    co.y+co.h/2,
    co.w/2,
    0,
    Math.PI*2
  );
  x.fill();

  x.strokeStyle='#fff3a3';
  x.lineWidth=3;
  x.stroke();

  x.fillStyle='#fff';
  x.font='14px Arial';
  x.fillText('$',co.x+8,co.y+18);
}

function drawDiamond(d){

  x.fillStyle='#00e5ff';

  x.beginPath();
  x.moveTo(d.x+d.w/2,d.y);
  x.lineTo(d.x+d.w,d.y+d.h/2);
  x.lineTo(d.x+d.w/2,d.y+d.h);
  x.lineTo(d.x,d.y+d.h/2);
  x.closePath();
  x.fill();

  x.strokeStyle='#fff';
  x.lineWidth=2;
  x.stroke();
}

function drawRamp(r){

  x.fillStyle='#9c27b0';

  x.beginPath();
  x.moveTo(r.x,r.y+r.h);
  x.lineTo(r.x+r.w,r.y+r.h);
  x.lineTo(r.x+r.w,r.y);
  x.closePath();
  x.fill();

  x.strokeStyle='#fff';
  x.lineWidth=3;
  x.stroke();
}

function drawCar(car){

  x.fillStyle=car.color;
  x.fillRect(car.x,car.y+12,car.w,30);

  x.fillStyle=car.color;
  x.fillRect(car.x+18,car.y,50,25);

  x.fillStyle='#9ee7ff';
  x.fillRect(car.x+25,car.y+5,16,12);
  x.fillRect(car.x+45,car.y+5,16,12);

  x.fillStyle='#111';

  x.beginPath();
  x.arc(car.x+20,car.y+43,8,0,Math.PI*2);
  x.arc(car.x+70,car.y+43,8,0,Math.PI*2);
  x.fill();
}

/* FIN */

function loseLife(){

  lives--;

  updateInfo();

  if(lives<=0){
    endGame();
  }
}

function endGame(){

  running=false;

  const final=Math.floor(score);

  if(final>bestScore){

    bestScore=final;

    localStorage.setItem(
      "skateRushBest",
      bestScore
    );
  }

  document.getElementById('finalScore').textContent=final;
  document.getElementById('finalBest').textContent=bestScore;
  document.getElementById('finalCoins').textContent=coinCount;
  document.getElementById('finalDiamonds').textContent=diamondCount;

  document.getElementById('gameover').style.display='grid';
}

/* UPDATE */

function update(){

  if(!running)return;

  score+=boosting ? 0.25 : 0.12;

  if(!boosting){
    speed+=0.0008;
  }

  // mouvement
  if(keys['ArrowLeft'] || keys['a']){
    player.x-=8;
  }

  if(keys['ArrowRight'] || keys['d']){
    player.x+=8;
  }

  player.x=Math.max(
    0,
    Math.min(W-player.w,player.x)
  );

  // gravité
  player.vy+=0.7;
  player.y+=player.vy;

  const ground=H*.62-player.h;

  if(player.y>=ground){

    player.y=ground;
    player.vy=0;
    player.on=true;
    player.rotation=0;
  }

  // rotation pendant un trick
  if(!player.on){
    player.rotation+=0.12;

    if(trickTimer<=0){

      trickText="🔥 TRICK !";
      trickTimer=35;
      score+=20;
    }
  }

  // compteurs
  spawnTimer++;
  coinTimer++;
  rampTimer++;
  diamondTimer++;
  carTimer++;

  if(spawnTimer>70){
    spawnObstacle();
    spawnTimer=0;
  }

  if(coinTimer>45){
    spawnCoin();
    coinTimer=0;
  }

  if(rampTimer>260){
    spawnRamp();
    rampTimer=0;
  }

  if(diamondTimer>400){
    spawnDiamond();
    diamondTimer=0;
  }

  if(carTimer>340){
    spawnCar();
    carTimer=0;
  }

  /* obstacles */

  for(let i=obs.length-1;i>=0;i--){

    const o=obs[i];

    o.x-=speed;

    if(hit(player,o)){

      if(player.y+player.h < o.y+15){
        continue;
      }

      obs.splice(i,1);
      loseLife();
      continue;
    }

    if(o.x+o.w<0){
      obs.splice(i,1);
    }
  }

  /* voitures */

  for(let i=cars.length-1;i>=0;i--){

    const car=cars[i];

    car.x-=speed*1.15;

    if(hit(player,car)){

      if(player.y+player.h < car.y+10){
        player.vy=-12;
        score+=30;
      }else{
        cars.splice(i,1);
        loseLife();
        continue;
      }
    }

    if(car.x+car.w<0){
      cars.splice(i,1);
    }
  }

  /* pièces */

  for(let i=coins.length-1;i>=0;i--){

    const co=coins[i];

    co.x-=speed;

    if(hit(player,co)){

      coinCount++;
      score+=25;

      boost=Math.min(100,boost+20);

      coins.splice(i,1);
      continue;
    }

    if(co.x+co.w<0){
      coins.splice(i,1);
    }
  }

  /* diamants */

  for(let i=diamonds.length-1;i>=0;i--){

    const d=diamonds[i];

    d.x-=speed;

    if(hit(player,d)){

      diamondCount++;
      score+=100;
      boost=Math.min(100,boost+40);

      trickText="💎 DIAMANT !";
      trickTimer=50;

      diamonds.splice(i,1);
      continue;
    }

    if(d.x+d.w<0){
      diamonds.splice(i,1);
    }
  }

  /* rampes */

  for(let i=ramps.length-1;i>=0;i--){

    const r=ramps[i];

    r.x-=speed;

    if(hit(player,r)){

      if(player.on){

        player.vy=-18;
        player.on=false;

        score+=50;
        trickText="🛹 BIG AIR !";
        trickTimer=55;
      }
    }

    if(r.x+r.w<0){
      ramps.splice(i,1);
    }
  }

  if(trickTimer>0){
    trickTimer--;
  }else{
    trickText="";
  }

  updateInfo();
}

/* DRAW */

function draw(){

  drawBackground();

  ramps.forEach(drawRamp);
  coins.forEach(drawCoin);
  diamonds.forEach(drawDiamond);
  cars.forEach(drawCar);
  obs.forEach(drawObstacle);

  drawPlayer();

  if(trickText){

    x.save();

    x.fillStyle="#fff";
    x.font="bold 28px Arial";
    x.textAlign="center";
    x.shadowColor="#000";
    x.shadowBlur=6;

    x.fillText(
      trickText,
      W/2,
      H*.25
    );

    x.restore();
  }
}

/* BOUCLE */

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}

loop();
</script>

</body>

<body>
<canvas id="game"></canvas>
<div id="info">⭐ Score: <span id="score">0</span> &nbsp; ❤️ <span id="lives">3</span></div>
<button id="jumpBtn" onclick="jump()" style="position:fixed;right:20px;bottom:20px;z-index:5;font-size:20px;padding:14px 20px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:bold">⬆️ SAUTER</button>
<div id="start"><div id="panel"><h1>🛹 SKATE RUSH</h1><p>← → pour bouger • Espace pour sauter</p><button onclick="startGame()">JOUER</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let W,H,player,obs,coins,score,lives,running=false,speed=7,keys={};
function resize(){W=c.width=innerWidth;H=c.height=innerHeight} addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=false);
function jump(){
  if(running && player && player.on){player.vy=-15;player.on=false}
}
c.addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});
c.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')jump()});


function startGame(){
 document.getElementById('start').style.display='none'; score=0;lives=3;speed=7;obs=[];coins=[];
 player={x:W*.25,y:H*.62,w:58,h:30,vy:0,on:true};
 running=true; requestAnimationFrame(loop);
}
function spawn(){
 if(Math.random()<.65) obs.push({x:W+50,y:H*.66-38,w:45,h:38});
 else coins.push({x:W+50,y:H*(.45+Math.random()*.18),r:11});
}
function hit(a,b){
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}
function loop(){
 if(!running)return;
 if(Math.random()<.025)spawn();
 if(keys.ArrowLeft)player.x-=7;if(keys.ArrowRight)player.x+=7;
 player.x=Math.max(20,Math.min(W-80,player.x));
 if((keys[' ']||keys.Space)&&player.on){jump()}
 player.vy+=.7;player.y+=player.vy;
 const ground=H*.66-player.h;
 if(player.y>=ground){player.y=ground;player.vy=0;player.on=true}
 obs.forEach(o=>o.x-=speed);coins.forEach(q=>q.x-=speed);
 for(let i=obs.length-1;i>=0;i--){
   let o=obs[i]; if(o.x+o.w<0)obs.splice(i,1);
   else {
     const playerHitbox={x:player.x+10,y:player.y+6,w:38,h:22};
     const obstacleHitbox={x:o.x+4,y:o.y+2,w:o.w-8,h:o.h-4};
     if(hit(playerHitbox,obstacleHitbox)){
       obs.splice(i,1);
       lives--;
       if(lives<=0)return gameOver();
     }
   }
 }
 for(let i=coins.length-1;i>=0;i--){
   let q=coins[i];let dx=player.x+player.w/2-q.x,dy=player.y+player.h/2-q.y;
   if(Math.hypot(dx,dy)<35){coins.splice(i,1);score+=10}
   else if(q.x<0)coins.splice(i,1);
 }
 score++; if(score%500===0)speed+=1;
 document.getElementById('score').textContent=score;
 document.getElementById('lives').textContent=lives;
 draw();requestAnimationFrame(loop);
}
function draw(){
 x.clearRect(0,0,W,H);
 // city
 x.fillStyle='#ddd';x.fillRect(0,H*.58,W,H*.08);
 for(let i=0;i<12;i++){x.fillStyle=i%2?'#b9c3cc':'#9faab4';x.fillRect(i*120,H*.25,90,H*.33)}
 // road
 x.fillStyle='#444';x.fillRect(0,H*.66,W,H*.34);
 x.strokeStyle='#fff';x.setLineDash([35,30]);x.lineWidth=5;x.beginPath();x.moveTo(0,H*.83);x.lineTo(W,H*.83);x.stroke();x.setLineDash([]);
 // obstacles
 obs.forEach(o=>{x.fillStyle='#e74c3c';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#fff';x.fillRect(o.x+8,o.y+8,o.w-16,7)});
 coins.forEach(q=>{x.fillStyle='#ffd43b';x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fill();x.fillStyle='#9a6d00';x.font='bold 14px Arial';x.fillText('★',q.x-7,q.y+5)});
 // skater
 x.fillStyle='#222';x.fillRect(player.x+10,player.y+8,38,18);
 x.fillStyle='#ffcc99';x.beginPath();x.arc(player.x+30,player.y-5,12,0,Math.PI*2);x.fill();
 x.strokeStyle='#1677ff';x.lineWidth=5;x.beginPath();x.moveTo(player.x+22,player.y+20);x.lineTo(player.x+15,player.y+35);x.moveTo(player.x+38,player.y+20);x.lineTo(player.x+45,player.y+35);x.stroke();
 x.fillStyle='#111';x.fillRect(player.x+3,player.y+34,50,5);x.fillStyle='#ddd';x.beginPath();x.arc(player.x+12,player.y+40,5,0,7);x.arc(player.x+44,player.y+40,5,0,7);x.fill();
}
function gameOver(){
 running=false;document.getElementById('start').style.display='grid';
 document.getElementById('panel').innerHTML='<h1>💥 GAME OVER</h1><p>Score : '+score+'</p><button onclick="startGame()">REJOUER</button>';
}
</script>
